<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 80" shape-rendering="crispEdges">
  <!-- Generic arcade cop sprite -->
  <rect width="64" height="80" fill="#000000"/>

  <!-- hat brim -->
  <rect x="10" y="14" width="44" height="4" fill="#1a1a2e"/>
  <!-- hat crown -->
  <rect x="16" y="4" width="32" height="12" fill="#24305e"/>
  <!-- badge on hat -->
  <rect x="28" y="6" width="8" height="6" fill="#f0c040"/>
  <rect x="30" y="7" width="4" height="4" fill="#fff4a3"/>

  <!-- head -->
  <rect x="20" y="18" width="24" height="18" fill="#e8b896"/>
  <!-- eyes -->
  <rect x="24" y="24" width="4" height="4" fill="#1a1a2e"/>
  <rect x="36" y="24" width="4" height="4" fill="#1a1a2e"/>
  <!-- mouth -->
  <rect x="28" y="30" width="8" height="2" fill="#8a4a3a"/>

  <!-- neck -->
  <rect x="28" y="36" width="8" height="4" fill="#e8b896"/>

  <!-- blue uniform torso -->
  <rect x="14" y="40" width="36" height="26" fill="#2f5fad"/>
  <!-- collar -->
  <rect x="22" y="40" width="8" height="4" fill="#f5f5f5"/>
  <rect x="34" y="40" width="8" height="4" fill="#f5f5f5"/>
  <!-- tie -->
  <rect x="30" y="44" width="4" height="10" fill="#1a1a2e"/>
  <!-- badge -->
  <rect x="18" y="48" width="8" height="8" fill="#f0c040"/>
  <rect x="20" y="50" width="4" height="4" fill="#fff4a3"/>
  <!-- belt -->
  <rect x="14" y="62" width="36" height="4" fill="#1a1a2e"/>
  <rect x="28" y="62" width="8" height="4" fill="#f0c040"/>

  <!-- arms -->
  <rect x="6" y="42" width="8" height="18" fill="#2f5fad"/>
  <rect x="50" y="42" width="8" height="18" fill="#2f5fad"/>
  <!-- hands -->
  <rect x="6" y="60" width="8" height="6" fill="#e8b896"/>
  <rect x="50" y="60" width="8" height="6" fill="#e8b896"/>

  <!-- holster / radio hint -->
  <rect x="48" y="52" width="6" height="10" fill="#1a1a2e"/>
  <rect x="49" y="54" width="4" height="3" fill="#6a6a6a"/>

  <!-- legs -->
  <rect x="18" y="66" width="10" height="10" fill="#24305e"/>
  <rect x="36" y="66" width="10" height="10" fill="#24305e"/>
  <!-- shoes -->
  <rect x="16" y="76" width="14" height="4" fill="#1a1a2e"/>
  <rect x="34" y="76" width="14" height="4" fill="#1a1a2e"/>
</svg>
